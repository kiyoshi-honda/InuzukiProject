<tr><td><a href="https://github.com/kiyoshi-honda/InuzukiProject/pull/13">#13 [Feature] 事前作成された対戦ルームに最大10人で参加できる</a><div class="markdown"><pre class="markdown-source">## 関連Issue

Closes #6

## 変更内容

- 事前作成された対戦ルームをH2に登録した。
- MyBatisのMapperを使い、ルーム情報と参加者情報を保存・取得できるようにした。
- 1ルームの参加者を最大10人に制限した。
- 同じ利用者の重複参加を防止した。
- 参加者ごとの入室状態と開始状態を保存できるようにした。
- 参加者全員が開始ボタンを押した場合、10人未満でもルームを対戦開始状態へ切り替えるようにした。
- 対戦ルーム画面に犬キャラクター、参加者一覧、各参加者の開始状態、ルーム状態、開始ボタンを表示した。
- Spring Securityのログインユーザーに `kodai/taro` と `oit/hanako` を追加した。既存の `yamada/taro` も維持している。
- SQL初期化の文字コードをUTF-8に設定し、開始フォームにCSRFトークンを追加した。

## 確認するDoD

- DoD 1: 確認済み。ログイン済み利用者が `/game` を開くと、事前作成ルームに参加した状態が表示される。
- DoD 2: 確認済み。参加者が9人以下の場合、新しい利用者が参加者として登録される。
- DoD 3: 手動確認は未確認。自動テストで10人参加済みのルームへの11人目の参加が拒否されることを確認している。
- DoD 4: 確認済み。参加者一覧と犬キャラクターが対戦画面に表示される。
- DoD 5: 確認済み。開始ボタンを押した参加者だけが開始済みとなり、他の参加者が未開始の場合は開始待ちになる。
- DoD 6: 確認済み。参加者全員が開始ボタンを押すと、10人未満でもルームが対戦開始状態になる。
- DoD 7: 確認済み。全員が開始するまでルームは開始待ちのままで、手の入力画面へ遷移しない。

## テストと確認内容

- `./gradlew test`: 成功。
- `GameRoomControllerTest`: 参加、満員、開始待ち、全員開始、CSRFトークン表示、複数ユーザー設定を確認済み。
- `UserDetailsService`から `yamada`、`kodai`、`oit` を読み込めることを確認済み。
- `gradle bootRun`: 起動成功。
- 手動確認済み: `/game` の表示、参加者の開始操作、全員開始までの開始待ち。
- 手動未確認: 10人参加済みルームへの11人目の参加拒否。

## 自分の理解とAI利用

ルーム参加者の情報をH2に保存し、参加者全員の入室状態と開始状態を切り替えられるようにした。参加者全員の開始状態を確認して、ルームの状態を切り替える設計である。

AIから提案された利用者によるルーム作成は、最初から実装すると操作や管理が煩雑になるため採用せず、事前作成ルームに限定した。また、10人集まらなくてもゲームを開始できるように変更した。</pre></div></td><td><a href="https://github.com/kiyoshi-honda/InuzukiProject/issues/6">#6 [Feature] 事前作成された対戦ルームに最大10人で参加できる</a><br>担当: igaki<div class="markdown"><pre class="markdown-source">## 機能の概要

あらかじめ用意された対戦ルームに、ログイン済み利用者が参加できる。1つのルームには最大10人まで参加でき、参加者全員が同じ犬キャラクターとの対戦画面を利用する。参加者全員が開始ボタンを押した時点で、満員でなくても対戦を開始できる。
今回しないこと: 利用者によるルーム作成・削除、ルーム検索、複数ルームの管理、リアルタイム通信。

## DoD（受入条件）

- Given ログイン済み利用者、When 対戦画面を開く、Then 事前作成された対戦ルームに参加した状態が表示される。
- Given ルームの参加者が9人以下、When 新しい利用者が参加する、Then 参加者として登録される。
- Given ルームの参加者が10人、When 新しい利用者が参加しようとする、Then 満員であることが表示され参加できない。
- Given 複数の参加者、When 対戦画面を表示する、Then 全員に同じルームの参加者一覧と犬キャラクターが表示される。
- Given 参加者が2人以上で開始ボタンを押していない利用者がいる、When 参加者の一人が開始ボタンを押す、Then その利用者の開始状態だけが保存され、対戦は開始されない。
- Given 参加者全員が開始ボタンを押す、When 開始状態を確認する、Then 参加者が10人未満でもルームが対戦開始状態になる。
- Given 参加者全員が開始ボタンを押していない、When ルーム状態を確認する、Then ルームは参加待ちまたは開始待ちのままで、手の入力画面に遷移しない。

## 関連ファイル・変更境界

- 変更候補: `inujanken/src/main/java/inuzuki/is/inujanken/SecurityConfig.java`（複数の検証用ログインユーザーが必要な場合に限る）。
- 新規候補: `inujanken/src/main/java/inuzuki/is/inujanken/room/` 配下のルームController、サービス、Mapper、モデル。
- 新規候補: `inujanken/src/main/resources/schema.sql`、`inujanken/src/main/resources/data.sql`（事前作成ルームと参加者データ、参加者ごとの開始状態）。
- 新規候補: `inujanken/src/main/resources/templates/game-room.html`。
- 新規候補: `inujanken/src/test/java/inuzuki/is/inujanken/room/` 配下のController・サービス・Mapperテスト。
- 既存の静的トップページの公開設定は変更しない。

## 実装計画

1. 事前作成ルーム、参加者、ルーム状態を表すDB構造と初期データを定義する。
2. ログインユーザーを参加者として登録し、同じユーザーの重複参加を防ぐ。
3. 参加者数が10人を超えないサービス処理を追加する。
4. 参加者ごとの開始状態を保存し、全員が開始した場合だけルームを対戦開始状態へ遷移させる。
5. 対戦画面に犬キャラクター、参加者一覧、開始状態、開始ボタン、現在のルーム状態を表示する。
6. MockMvcとDBを使い、参加・満員・重複参加・全員開始・開始待ちを確認する。

## DoD確認方法

- DoD 1: MockMvcで認証済み利用者が事前作成ルームを表示できることを確認する。
- DoD 2: サービスまたはMapperテストで9人以下の参加と参加者登録を確認する。
- DoD 3: サービステストで10人目までの参加成功と11人目の拒否を確認する。
- DoD 4: MockMvcまたはThymeleafテストで参加者一覧と犬キャラクターの表示を確認する。
- DoD 5: サービステストで一部の参加者だけが開始した場合に対戦開始しないことを確認する。
- DoD 6: サービステストで参加者全員が開始した場合、10人未満でも対戦開始状態になることを確認する。
- DoD 7: MockMvcテストで開始状態と開始ボタンの表示を確認する。

## 変更しないものとリスク

- 利用者によるルーム作成・削除は変更しない。
- 満員になることは開始条件にせず、参加者全員の開始操作を開始条件とする。
- 認証方式をDBユーザー管理へ変更するかは、既存の認証方針とテスト用ユーザー数の確認が必要である。
- 同時参加処理の厳密な排他制御は、初期版ではサービスとDB制約で検証し、負荷試験は行わない。</pre></div></td><td>2026-09-04 14:08 JST</td><td>2026-09-04 14:23 JST</td><td>15分</td></tr>
