<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>みんなのわんこルーム</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 2rem auto;
      max-width: 42rem;
      padding: 0 1rem;
    }

    .dog {
      font-size: 5rem;
      text-align: center;
    }

    .status {
      font-weight: bold;
    }

    .error {
      color: #b00020;
    }

    li {
      margin: .5rem 0;
    }

    button {
      padding: .6rem 1rem;
    }
  </style>
</head>

<body>
  <main>
    <h1 th:text="${gameRoom.room.name}">みんなのわんこルーム</h1>
    <div class="dog" role="img" aria-label="犬キャラクター">🐶</div>
    <p class="status">状態: <span th:if="${gameRoom.started}">対戦開始</span><span th:unless="${gameRoom.started}">開始待ち</span>
    </p>
    <p th:if="${errorMessage}" class="error" th:text="${errorMessage}"></p>

    <h2>参加者 (<span th:text="${gameRoom.participants.size()}">0</span>/10)</h2>
    <ul>
      <li th:each="participant : ${gameRoom.participants}">
        <span th:text="${participant.username}">参加者</span>
        <span th:if="${participant.started}">（開始済み）</span>
        <span th:unless="${participant.started}">（開始待ち）</span>
      </li>
    </ul>

    <p th:if="${gameRoom.isEveryoneStarted()}">全員の準備が完了しました。</p>
    <form th:if="${gameRoom.waiting and !gameRoom.currentUserStarted}" method="post" action="/game/start">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
      <button type="submit">開始</button>
    </form>
    <p th:if="${gameRoom.currentUserStarted and gameRoom.waiting}">あなたは開始済みです。他の参加者を待っています。</p>
    <p th:if="${gameRoom.started}">対戦画面へ進めます。</p>
  </main>
</body>

</html>
