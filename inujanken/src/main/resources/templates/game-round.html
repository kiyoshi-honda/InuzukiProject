<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <title>わんこ対戦</title>
  <style>
    body { font-family: sans-serif; margin: 2rem auto; max-width: 42rem; padding: 0 1rem; }
    .dog { font-size: 4rem; text-align: center; }
    .status { font-weight: bold; }
    li { margin: .5rem 0; }
    button { padding: .6rem 1rem; margin-right: .5rem; }
  </style>
</head>

<body>
  <main>
    <h1>わんこ対戦</h1>
    <div class="dog" role="img" aria-label="犬キャラクター">🐶</div>
    <section th:if="${!gameRound.complete}">
      <p class="status">入力待ち</p>
      <p th:if="${gameRound.currentUserSubmitted}">あなたの手を受け付けました。他の参加者を待っています。</p>
      <form th:unless="${gameRound.currentUserSubmitted}" method="post" action="/game/round/hand">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <fieldset>
          <legend>手を選んでください</legend>
          <button th:each="hand : ${hands}" type="submit" name="hand" th:value="${hand.name()}"
            th:text="${hand.label}">グー</button>
        </fieldset>
      </form>
    </section>
    <section th:if="${gameRound.complete}">
      <p class="status">結果</p>
      <p>犬の手: <strong th:text="${gameRound.dogHand.label}">グー</strong></p>
      <h2>参加者の結果</h2>
      <ul>
        <li th:each="participant : ${gameRound.participants}">
          <span th:text="${participant.username}">参加者</span>:
          <span th:text="${participant.hand.label}">チョキ</span> —
          <strong th:text="${participant.outcome.label}">勝ち</strong>
        </li>
      </ul>
    </section>
    <p><a href="/game">ルームに戻る</a></p>
  </main>
</body>

</html>
